schema_version: 1
environment_id: nse_workstation_example

option_catalogs: []

# NSEの実行環境はこの設計書だけで管理する。
# modelは物理モデル、caseはcase.yamlの入力雛形、parallelは
# MPI/OpenMP/CUDAの使用可否、executionはビルド構成を選択する。
# solver.profileはmodel、parallel、実際のcase内容から自動選択される。
# CPU/MPIでは通常版と2DECOMP&FFT版が同梱され、Taylor-Greenでは通常版、
# HITまたはPetersen-Livescu forcingではFFT版へrun_case.pyが自動切替する。
# MPIプロセス数とOpenMPスレッド数はrun_case.pyの実行時に指定する。
#
# CPU MPI + OpenMP:
#   model: nse
#   case: nse_case
#   parallel.use_mpi: true
#   parallel.use_openmp: true
#   parallel.use_cuda: false
#
# CUDA single GPU:
#   model: nse
#   case: nse_case
#   parallel.use_mpi: false
#   parallel.use_openmp: false
#   parallel.use_cuda: true
#
# MPI + CUDA multi-GPU (one MPI rank per GPU):
#   model: nse
#   case: nse_case
#   parallel.use_mpi: true
#   parallel.use_openmp: false
#   parallel.use_cuda: true
select:
  source: local_framework
  destination: windows_research_runs
  model: nse
  target: windows_gnu_msmpi
  case: nse_case
  execution: release
  scheduler: disabled
  archive: none

parallel:
  use_mpi: true
  use_openmp: true
  use_cuda: false

case:
  id: case0001
  label: nse_baseline
  description: NSE baseline case
  project_name: NSEResearch
