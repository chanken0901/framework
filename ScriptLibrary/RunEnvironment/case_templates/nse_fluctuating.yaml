# case-template-overlay: materialized by prepare_environment.py
# Inherit ALL standard NSE options and comments, including HIT and forcing.
template_base: nse.yaml
overrides:
  schema_version: 2
  extensions:
    fluctuating_hydrodynamics: config/fluctuating_hydrodynamics.yaml
  status: development
  physics.nse.mach_number: 0.1
  grid.nx: 16
  grid.ny: 16
  grid.nz: 16
  time.t_max: 0.01
  time.nsteps: 100
  time.use_fixed_dt: true
