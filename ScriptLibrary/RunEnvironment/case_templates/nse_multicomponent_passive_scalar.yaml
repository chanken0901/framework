schema_version: 2
case_id: {{case_id}}
case_label: {{case_label}}
status: development
description: {{description}}
created_at: {{created_at}}

project:
  name: {{project_name}}
  author: Kento Tanaka

physics:
  model: {{physics_model}}

extensions:
  multicomponent: config/multicomponent.yaml

grid:
  nx: 32
  ny: 16
  nz: 16
  x_min: 0.0
  x_max: 1.0
  y_min: 0.0
  y_max: 1.0
  z_min: 0.0
  z_max: 1.0

flow:
  type: passive_scalar_advection
  velocity: [1.0, 0.25, 0.0]
  passive_scalar:
    initial_condition: gaussian
    tracer_background: 0.05
    tracer_amplitude: 0.90
    tracer_center: [0.25, 0.5, 0.5]
    tracer_width: 0.08

time:
  cfl: 0.45
  # dt=0 lets the solver derive a stable value from the multidimensional CFL.
  dt: 0.0
  nsteps: 40

numerics:
  convective_scheme: upwind1
  boundary_condition: periodic
  time_integration: ssprk3

solver:
  profile: {{solver_profile}}
  use_mpi: {{use_mpi}}
  use_openmp: {{use_openmp}}
  use_cuda: {{use_cuda}}
  mpi_processes: {{mpi_processes}}
  omp_threads: {{omp_threads}}

output:
  write_final: true
  filename: passive_scalar_final.csv

storage:
  raw_data_location: {{raw_data_location}}

outputs:
  used_in:
