schema_version: 2
case_id: {{case_id}}
case_label: {{case_label}}
status: development
description: {{description}}
created_at: {{created_at}}

project:
  name: {{project_name}}
  author: Kento Tanaka

physics:
  model: {{physics_model}}

extensions:
  multicomponent: config/multicomponent.yaml
  thermodynamics: config/thermodynamics.yaml
  chemistry: config/chemistry.yaml

flow:
  type: homogeneous_reactor
  homogeneous_reactor:
    density: 1.0
    temperature: 1200.0
    mass_fractions:
      fuel: 0.5
      oxidizer: 0.5
      product: 0.0

time:
  # dt=0 selects the chemistry-CFL timestep, capped by maximum_dt.
  dt: 0.0
  maximum_dt: 1.0e-3
  chemistry_cfl: 0.1
  nsteps: 100

solver:
  profile: {{solver_profile}}
  use_mpi: {{use_mpi}}
  use_openmp: {{use_openmp}}
  use_cuda: {{use_cuda}}
  mpi_processes: {{mpi_processes}}
  omp_threads: {{omp_threads}}

output:
  write_history: true
  output_every: 1
  filename: homogeneous_reactor.csv

storage:
  raw_data_location: {{raw_data_location}}

outputs:
  used_in:
