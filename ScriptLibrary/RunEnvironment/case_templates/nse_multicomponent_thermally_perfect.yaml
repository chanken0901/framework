schema_version: 2
case_id: {{case_id}}
case_label: {{case_label}}
status: development
description: {{description}}
created_at: {{created_at}}

project:
  name: {{project_name}}
  author: Kento Tanaka

physics:
  model: {{physics_model}}

extensions:
  multicomponent: config/multicomponent.yaml
  thermodynamics: config/thermodynamics.yaml

grid:
  nx: 64
  ny: 4
  nz: 4
  x_min: 0.0
  x_max: 1.0
  y_min: 0.0
  y_max: 1.0
  z_min: 0.0
  z_max: 1.0

flow:
  type: multispecies_sod
  multispecies_sod:
    initial_condition: multispecies_sod_x
    interface_location: 0.5
    left:
      density: 1.17197031944841
      velocity: [0.0, 0.0, 0.0]
      pressure: 101325.0
      mass_fractions: [0.767, 0.233]
    right:
      density: 0.126389266436632
      velocity: [0.0, 0.0, 0.0]
      pressure: 10132.5
      mass_fractions: [0.2, 0.8]

time:
  cfl: 0.20
  dt: 0.0
  nsteps: 20

numerics:
  convective_scheme: rusanov1
  boundary_condition: periodic
  time_integration: ssprk3

solver:
  profile: {{solver_profile}}
  use_mpi: {{use_mpi}}
  use_openmp: {{use_openmp}}
  use_cuda: {{use_cuda}}
  mpi_processes: {{mpi_processes}}
  omp_threads: {{omp_threads}}

output:
  write_final: true
  filename: multicomponent_thermally_perfect_final.csv

storage:
  raw_data_location: {{raw_data_location}}

outputs:
  used_in:
