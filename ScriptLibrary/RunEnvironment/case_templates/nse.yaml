case_id: {{case_id}}
case_label: {{case_label}}
status: planned
description: {{description}}
created_at: {{created_at}}

project:
  name: {{project_name}}
  author: Kento Tanaka

physics:
  model: {{physics_model}}
  nse:
    nv: 5
    nghost: 3
    gamma: 1.4
    small_rho: 1.0e-12
    small_p: 1.0e-12
    rho0: 1.0
    # Used directly by non-HIT flows. HIT derives these two solver values
    # from flow.hit turbulent targets and the selected spectrum length.
    mach_number: 0.5
    reynolds_number: 100.0
    # Thermal diffusion is coupled through 1 / (Re * Pr).
    prandtl_number: 0.72

flow:
  type: taylor_green
  taylor_green:
    amplitude: 1.0
    mode_x: 1
    mode_y: 1
    mode_z: 1
  hit:
    # Initial turbulent targets. turbulent_reynolds_number is Re_lambda,
    # matching Re_ini in the original HIT code.
    turbulent_mach_number: 0.5
    turbulent_reynolds_number: 30.0
    random_seed: 13579
    dealias_fraction: 0.6666666666666667
    isotropy_mode: projected_shell
    isotropy_k_cutoff: 2.5
    isotropy_tolerance: 1.0e-8
    isotropy_max_iterations: 80
    spectrum:
      # choices: johnsen, pope
      type: johnsen
      johnsen:
        characteristic_length: 1.0
        # Original L_lambda. k_peak = 2 * ratio / characteristic_length.
        length_scale_ratio: 2.0
      pope:
        integral_length: 1.0
        energy_constant: 1.5
        large_scale_constant: 6.78
        dissipation_constant: 0.40
        large_scale_exponent: 2.0
        dissipation_exponent: 5.2
  imported_turbulence:
    # First convert rank-wise solver output to one ghost-free portable SLF:
    # python SolverLibrary/NSE/tools/nse_prepare_imported_turbulence.py <output-dir> -o <case-dir>/initial_data/turbulence.slf
    file: initial_data/turbulence.slf
    # embed: place one turbulence block in a longer x domain.
    # tile: periodically repeat it; target nx must be a multiple of source nx.
    mode: embed
    # Physical x coordinate of the source block's lower cell boundary.
    x_start: 0.0
    # Raised-cosine transition cells at both x ends; use 0 for an exact copy.
    blend_cells: 8
    # Added to the velocity stored in the source field, e.g. a mean x flow.
    velocity_offset: [0.0, 0.0, 0.0]
    # State used outside the block and in the embed transition.
    background:
      density: 1.0
      velocity: [0.0, 0.0, 0.0]
      pressure: 0.7142857142857143

# Petersen-Livescu linear forcing. Set type to petersen_livescu for
# statistically stationary periodic turbulence. run_case.py selects the
# staged CPU/MPI 2DECOMP&FFT, single-GPU cuFFT, or MPI+CUDA cuFFTMp
# profile automatically.
forcing:
  # choices: none, petersen_livescu
  type: none
  petersen_livescu:
    # choices: full_spectrum, low_wavenumber
    spectrum: low_wavenumber
    # choices: auto, 2decomp_fftw, cufft, cufftmp
    fft_backend: auto
    k_cutoff: 2.5
    target_dissipation: 0.1
    dilatational_ratio: 0.0
    denominator_floor: 1.0e-14
    max_coefficient: 0.0
    report_interval: 100

grid:
  nx: 64
  ny: 64
  nz: 64
  nghost: 3
  x_min: 0.0
  x_max: 6.283185307179586
  y_min: 0.0
  y_max: 6.283185307179586
  z_min: 0.0
  z_max: 6.283185307179586

time:
  cfl: 0.5
  dt: 1.0e-4
  t_max: 0.1
  nsteps: 1000
  output_frequency: 100
  use_fixed_dt: false

solver:
  type: nse_fvm
  # MPI/CUDAとビルドプロファイルはenvironment設計書から自動決定される。
  # OpenMPだけは対応するCPU版でケースごとに切り替えられる。
  use_openmp: {{use_openmp}}
  mpi_processes: {{mpi_processes}}
  omp_threads: {{omp_threads}}

numerics:
  # Options: keep2, keep6, weno5z_roe, hybrid
  convective_scheme: keep6
  # Used only when convective_scheme is hybrid.
  hybrid:
    smooth_scheme: keep6
    shock_scheme: weno5z_roe
    sensor: ducros_pressure
    sensor_onset: 0.01
    sensor_full: 0.10
  viscous_scheme: central6
  boundary_condition: periodic
  time_integrator: ssprk3
  time_integration: ssprk3

output:
  directory: output
  format: slf
  precision: float64
  write_initial: true
  write_meta: true

storage:
  raw_data_location: {{raw_data_location}}

outputs:
  used_in:
