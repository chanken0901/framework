schema_version: 1
catalog_id: builtin
description: 外部実行環境の標準選択肢
allow_override: false

options:
  source:
    framework_relative:
      label: ツール基準のフレームワーク
      description: 設計書をRunEnvironment内に置く場合に、ローカルFrameWorkを相対参照する。
      values:
        framework_root: ../..
        model_catalog: ScriptLibrary/BuildSolver/model_catalog.yaml
    local_framework:
      label: ローカルFrameWork
      description: 編集元であるCドライブ上のローカルFrameWorkを参照する。
      values:
        framework_root: C:/Users/Owner/Documents/Codex/FrameWork
        model_catalog: ScriptLibrary/BuildSolver/model_catalog.yaml
    mozart_nas:
      label: Mozart NAS同期ミラー
      description: 同期先NAS上のFrameWorkを参照する。通常の編集・環境生成には使わない。
      values:
        framework_root: \\Mozart\share\FrameWork
        model_catalog: ScriptLibrary/BuildSolver/model_catalog.yaml
    hpc_mounted_framework:
      label: スパコンにマウントしたフレームワーク
      description: 特別な運用でLinuxの/mnt/framework以下に配置したミラーを参照する。
      values:
        framework_root: /mnt/framework/FrameWork
        model_catalog: ScriptLibrary/BuildSolver/model_catalog.yaml

  destination:
    windows_research_runs:
      label: WindowsローカルのResearchRuns
      description: Windowsユーザープロファイル以下へ実行環境を生成する。
      values:
        root: ${USERPROFILE}/ResearchRuns
        case_index: ${USERPROFILE}/ResearchRuns/case_index.csv
        auto_case_number: true
        case_number_width: 4
        case_number_start: 1
    local_generated:
      label: 設計書と同じ場所のgenerated
      description: 設計書が置かれたフォルダのgenerated以下へ生成する。
      values:
        root: generated/gpe_case0001
        case_index: generated/case_index.csv
    hpc_scratch:
      label: スパコンのscratch
      description: 環境変数SCRATCHが示す領域へ実行環境を生成する。
      values:
        root: ${SCRATCH}/gpe_case0001
        case_index: ${SCRATCH}/case_index.csv

  model:
    nse:
      label: 圧縮性NSE
      description: 圧縮性Navier-Stokes方程式を解く。CPU/GPUとMPIはparallelで選択する。
      values:
        name: nse
    nse_multicomponent:
      label: 多成分NSE基盤
      description: 多成分・反応流拡張の基盤からstage-3温度・組成依存熱力学までを提供する。
      values:
        name: nse_multicomponent
    gpe:
      label: GPE
      description: Gross-Pitaevskii方程式を解く。CPU/GPUとMPIはparallelで選択する。
      values:
        name: gpe

  target:
    windows_gnu_msmpi:
      label: Windows GNUおよびMicrosoft MPI
      description: GNU Fortran、Ninja、Microsoft MPIを使うWindows環境。
      values:
        type: workstation
        machine_profile: ScriptLibrary/BuildSolver/machine_profiles/windows_gnu_msmpi.yaml
    linux_gnu_mpi:
      label: Linux GNU MPI
      description: システムMPIを使うLinuxワークステーションまたは対話ノード。
      values:
        type: workstation
        machine_profile: ScriptLibrary/BuildSolver/machine_profiles/linux_gnu_mpi.yaml
    linux_hpc_slurm:
      label: Linuxスパコン Slurm
      description: Slurmとスパコン用machine設定を使うLinuxクラスタ。
      values:
        type: hpc_slurm
        machine_profile: ScriptLibrary/RunEnvironment/machine_profiles/linux_hpc_slurm.yaml

  case:
    nse_case:
      label: NSE case
      description: 流れ場条件をcase.yamlで選択するNSE共通caseを生成する。
      requires:
        model.name: nse
      values:
        create: true
        template: ScriptLibrary/RunEnvironment/case_templates/nse.yaml
        id: case0001
        label: nse_baseline
        description: NSE baseline case
        project_name: NSEResearch
        data_root: results
    nse_multicomponent_foundation:
      label: 多成分NSE stage-0 case
      description: 1成分極限と非反応provider構成を検証する開発用caseを生成する。
      requires:
        model.name: nse_multicomponent
      values:
        create: true
        template: ScriptLibrary/RunEnvironment/case_templates/nse_multicomponent.yaml
        extension_templates:
          multicomponent: ScriptLibrary/RunEnvironment/case_templates/extensions/multicomponent_foundation.yaml
        id: case0001
        label: multicomponent_foundation
        description: Multicomponent NSE stage-0 foundation
        project_name: NSEMulticomponentResearch
        data_root: results
    nse_multicomponent_passive_scalar:
      label: 多成分NSE stage-1パッシブスカラー
      description: 一定速度場における保存形式の周期パッシブスカラー移流caseを生成する。
      requires:
        model.name: nse_multicomponent
      values:
        create: true
        template: ScriptLibrary/RunEnvironment/case_templates/nse_multicomponent_passive_scalar.yaml
        extension_templates:
          multicomponent: ScriptLibrary/RunEnvironment/case_templates/extensions/multicomponent_passive_scalar.yaml
        id: case0001
        label: passive_scalar
        description: Periodic conservative passive-scalar advection
        project_name: NSEMulticomponentResearch
        data_root: results
    nse_multicomponent_inviscid:
      label: 多成分NSE stage-2非粘性流
      description: 非反応・非粘性多成分Euler方程式のSod問題caseを生成する。
      requires:
        model.name: nse_multicomponent
      values:
        create: true
        template: ScriptLibrary/RunEnvironment/case_templates/nse_multicomponent_inviscid.yaml
        extension_templates:
          multicomponent: ScriptLibrary/RunEnvironment/case_templates/extensions/multicomponent_inviscid.yaml
          thermodynamics: ScriptLibrary/RunEnvironment/case_templates/extensions/thermodynamics_calorically_perfect.yaml
        id: case0001
        label: multispecies_sod
        description: Non-reacting inviscid multicomponent Sod problem
        project_name: NSEMulticomponentResearch
        data_root: results
    nse_multicomponent_thermally_perfect:
      label: 多成分NSE stage-3熱的完全気体
      description: NASA-7物性による温度・組成依存の非反応多成分Euler計算を生成する。
      requires:
        model.name: nse_multicomponent
      values:
        create: true
        template: ScriptLibrary/RunEnvironment/case_templates/nse_multicomponent_thermally_perfect.yaml
        extension_templates:
          multicomponent: ScriptLibrary/RunEnvironment/case_templates/extensions/multicomponent_thermally_perfect.yaml
          thermodynamics: ScriptLibrary/RunEnvironment/case_templates/extensions/thermodynamics_thermally_perfect.yaml
        id: case0001
        label: thermally_perfect_sod
        description: Thermally-perfect non-reacting multicomponent Sod problem
        project_name: NSEMulticomponentResearch
        data_root: results
    nse_multicomponent_viscous:
      label: Multicomponent NSE stage-4 transport
      description: Periodic species wave with diffusion, viscosity, and heat conduction.
      requires:
        model.name: nse_multicomponent
      values:
        create: true
        template: ScriptLibrary/RunEnvironment/case_templates/nse_multicomponent_viscous.yaml
        extension_templates:
          multicomponent: ScriptLibrary/RunEnvironment/case_templates/extensions/multicomponent_viscous.yaml
          thermodynamics: ScriptLibrary/RunEnvironment/case_templates/extensions/thermodynamics_thermally_perfect.yaml
          transport: ScriptLibrary/RunEnvironment/case_templates/extensions/transport_mixture_averaged.yaml
        id: case0001
        label: viscous_species_wave
        description: Stage-4 multicomponent transport validation
        project_name: NSEMulticomponentResearch
        data_root: results
    nse_multicomponent_reactor:
      label: Multicomponent NSE stage-5 reactor
      description: Adiabatic constant-volume homogeneous finite-rate chemistry.
      requires:
        model.name: nse_multicomponent
      values:
        create: true
        template: ScriptLibrary/RunEnvironment/case_templates/nse_multicomponent_reactor.yaml
        extension_templates:
          multicomponent: ScriptLibrary/RunEnvironment/case_templates/extensions/multicomponent_reactor.yaml
          thermodynamics: ScriptLibrary/RunEnvironment/case_templates/extensions/thermodynamics_one_step_reactor.yaml
          chemistry: ScriptLibrary/RunEnvironment/case_templates/extensions/chemistry_one_step_arrhenius.yaml
        id: case0001
        label: homogeneous_reactor
        description: Stage-5 adiabatic constant-volume finite-rate chemistry
        project_name: NSEMulticomponentResearch
        data_root: results
    gpe_quantum_taylor_green:
      label: GPE量子Taylor-Green
      description: 周期的な量子Taylor-Green渦caseを生成する。
      requires:
        model.name: gpe
      values:
        create: true
        template: ScriptLibrary/RunEnvironment/case_templates/gpe_quantum_taylor_green.yaml
        id: case0001
        label: qtgv_baseline
        description: Quantum Taylor-Green baseline
        project_name: GPEResearch
        data_root: results

  execution:
    debug:
      label: Debug
      description: 並列機能の構成とは独立したDebugビルド。
      values:
        configuration: Debug
        parallel_jobs: 4
    release:
      label: Release
      description: 並列機能の構成とは独立したReleaseビルド。
      values:
        configuration: Release
        parallel_jobs: 8
    relwithdebinfo:
      label: RelWithDebInfo
      description: 最適化とデバッグ情報を有効にしたビルド。
      values:
        configuration: RelWithDebInfo
        parallel_jobs: 8

  scheduler:
    disabled:
      label: スケジューラなし
      description: ジョブ投入スクリプトを生成しない。
      values:
        enabled: false
    slurm:
      label: Slurm
      description: 並列数をsbatch実行時に指定する汎用Slurmスクリプトを生成する。
      requires:
        target.type: hpc_slurm
      values:
        enabled: true
        job_name: solver-case0001
        account:
        partition:
        time_limit: 01:00:00
        output: slurm-%j.out
        modules:
          - gcc
          - openmpi
          - fftw
        extra_directives: []
        test: false

  archive:
    none:
      label: アーカイブなし
      description: 生成した実行環境フォルダだけを保持する。
      values:
        enabled: false
        format: zip
        output:
    zip:
      label: ZIPアーカイブ
      description: 生成後にZIPアーカイブを作成する。
      values:
        enabled: true
        format: zip
        output:
    gztar:
      label: gzip圧縮tarアーカイブ
      description: 生成後にtar.gzアーカイブを作成する。
      values:
        enabled: true
        format: gztar
        output:
