# LEGACY CONFIGURATION ONLY
#
# FrameWorkは2026年8月19日にモノレポへ移行済みです。現行のframework.gitでは
# ScriptLibraryとSolverLibraryを独立リポジトリとして操作しません。本ファイルは
# 旧分離リポジトリの履歴確認用であり、学生の日常開発では使用しないでください。

schema_version: 1

framework_root: C:/Users/Owner/Documents/Codex/FrameWork

settings:
  git_command: git
  default_branch: main
  default_remote: origin
  max_changed_file_mb: 50
  user_name:
  user_email:

repositories:
  ScriptLibrary:
    enabled: true
    path: "{framework_root}/ScriptLibrary"
    branch: main
    remote: origin
    remote_url: https://github.com/chanken0901/ScriptLibrary.git

  SolverLibrary:
    enabled: true
    path: "{framework_root}/SolverLibrary"
    branch: main
    remote: origin
    remote_url: https://github.com/chanken0901/SolverLibrary.git

