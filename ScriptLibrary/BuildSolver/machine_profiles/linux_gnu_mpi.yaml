# Linux・スパコン、GNU Fortran、システムMPI向けの共通マシンプロファイル。
schema_version: 1
profile_id: linux_gnu_mpi
platform: linux
generator: Ninja

tools:
  cmake: cmake
  ctest: ctest
  mpi_launcher: mpiexec
  mpi_process_option: -n

compiler:
  fortran: mpifort
  common_flags:
    - -fallow-invalid-boz
    - -fallow-argument-mismatch
  warning_flags:
    - -Wall
    - -Wextra
  debug_flags:
    - -O0
    - -g
    - -fcheck=all
    - -fbacktrace
  release_flags:
    - -O2
  relwithdebinfo_flags:
    - -O2
    - -g

mpi:
  provider: SYSTEM

openmp:
  enabled: true

libraries:
  fftw_root:
  decomp2d_root:
  cuda_compiler:
  cuda_toolkit_root:
  cuda_architectures:
  cufftmp_root:
  nvshmem_root:
  cufftmp_api: auto

environment: {}
