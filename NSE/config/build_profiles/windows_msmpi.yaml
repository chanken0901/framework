# Windows + GNU Fortran + Microsoft MPI用のマシンプロファイル。
schema_version: 1
profile_id: windows_msmpi
platform: windows

generator: Ninja

tools:
  cmake: cmake
  mpi_launcher: mpiexec
  mpi_process_option: -n

compiler:
  fortran: C:/msys64/ucrt64/bin/gfortran.exe
  common_flags:
    - -fallow-invalid-boz
    - -fallow-argument-mismatch
  warning_flags:
    - -Wall
    - -Wextra
  debug_flags:
    - -O0
    - -g
    - -fcheck=all
    - -fbacktrace
  release_flags:
    - -O2
  relwithdebinfo_flags:
    - -O2
    - -g

mpi:
  enabled: true
  provider: MSMPI
  root: C:/Program Files (x86)/Microsoft SDKs/MPI

openmp:
  enabled: true
