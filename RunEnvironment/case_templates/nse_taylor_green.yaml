case_id: {{case_id}}
case_label: {{case_label}}
status: planned
description: {{description}}
created_at: {{created_at}}

project:
  name: {{project_name}}
  author: Kento Tanaka

physics:
  model: {{physics_model}}
  nse:
    nv: 5
    nghost: 3
    gamma: 1.4
    small_rho: 1.0e-12
    small_p: 1.0e-12
    rho0: 1.0
    mach_number: 0.5
    reynolds_number: 10000.0
    prandtl_number: 0.72

flow:
  type: tgv

grid:
  nx: 64
  ny: 64
  nz: 64
  nghost: 3
  x_min: 0.0
  x_max: 6.283185307179586
  y_min: 0.0
  y_max: 6.283185307179586
  z_min: 0.0
  z_max: 6.283185307179586

time:
  cfl: 0.5
  dt: 1.0e-4
  t_max: 0.1
  nsteps: 1000
  output_frequency: 100
  use_fixed_dt: true

solver:
  type: nse_fvm
  profile: {{solver_profile}}
  processes: {{processes}}
  use_openmp: true
  omp_threads: {{omp_threads}}

numerics:
  reconstruction:
  time_integration: RK3
  flux: KEEP

output:
  directory: output
  format: slf
  precision: float64
  write_initial: true
  write_meta: true

storage:
  raw_data_location: {{raw_data_location}}

outputs:
  used_in:
