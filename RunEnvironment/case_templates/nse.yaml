case_id: {{case_id}}
case_label: {{case_label}}
status: planned
description: {{description}}
created_at: {{created_at}}

project:
  name: {{project_name}}
  author: Kento Tanaka

physics:
  model: {{physics_model}}
  nse:
    nv: 5
    nghost: 3
    gamma: 1.4
    small_rho: 1.0e-12
    small_p: 1.0e-12
    rho0: 1.0
    mach_number: 0.5
    reynolds_number: 100.0
    prandtl_number: 0.72

flow:
  type: taylor_green
  taylor_green:
    amplitude: 1.0
    mode_x: 1
    mode_y: 1
    mode_z: 1
  hit:
    spectrum: johnsen
    random_seed: 13579
    rms_velocity: 0.1
    peak_wavenumber: 4.0
    integral_length: 1.0
    kolmogorov_length: 0.02
    dealias_fraction: 0.6666666666666667

# Petersen-Livescu linear forcing. Set type to petersen_livescu for
# statistically stationary periodic turbulence. CPU forcing requires the
# cpu_mpi_2decomp_fftw profile; single-GPU forcing requires cuda_single.
forcing:
  type: none
  spectrum: low_wavenumber
  fft_backend: auto
  k_cutoff: 2.5
  target_dissipation: 0.1
  dilatational_ratio: 0.0
  denominator_floor: 1.0e-14
  max_coefficient: 0.0
  report_interval: 100

grid:
  nx: 64
  ny: 64
  nz: 64
  nghost: 3
  x_min: 0.0
  x_max: 6.283185307179586
  y_min: 0.0
  y_max: 6.283185307179586
  z_min: 0.0
  z_max: 6.283185307179586

time:
  cfl: 0.5
  dt: 1.0e-4
  t_max: 0.1
  nsteps: 1000
  output_frequency: 100
  use_fixed_dt: false

solver:
  type: nse_fvm
  profile: {{solver_profile}}
  use_mpi: {{use_mpi}}
  use_openmp: {{use_openmp}}
  use_cuda: {{use_cuda}}
  mpi_processes: {{mpi_processes}}
  omp_threads: {{omp_threads}}

numerics:
  reconstruction: none
  convective_scheme: keep6
  viscous_scheme: central6
  boundary_condition: periodic
  time_integrator: ssprk3
  time_integration: ssprk3

output:
  directory: output
  format: slf
  precision: float64
  write_initial: true
  write_meta: true

storage:
  raw_data_location: {{raw_data_location}}

outputs:
  used_in:
