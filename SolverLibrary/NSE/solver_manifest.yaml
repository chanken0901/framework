# NSEを共通モデルビルドランナーへ公開するソルバーマニフェスト。
schema_version: 1
solver_id: nse
solver_api_version: 1
model: nse
runtime_profile_selection: true
default_profiles:
  mpi: cpu_mpi
  cuda: cuda_single
  mpi_cuda: cuda_mpi
build_adapter: nse_cmake_v1
cmake_file: CMakeLists.txt

input:
  default_name: input.dat
  pass_as_argument: true

distribution:
  required_files:
    - CMakeLists.txt
    - cmake/NSEMPI.cmake

components:
  core:
    cmake_role: library
    files:
      - src/common/mod_precision.f90
      - src/common/mod_constants.f90
      - src/common/mod_common_config.f90
      - src/common/mod_model_config.f90
      - src/extensions/fluctuating/mod_fh_random.f90
      - src/extensions/fluctuating/mod_nse_fluctuating.f90
      - src/forcing/mod_nse_forcing_common.f90
      - src/grid/mod_grid_fvm.f90
      - src/field/mod_field_nse.f90
      - src/io/mod_input_reader.f90
      - src/io/mod_slf_output.f90

  mpi_real:
    cmake_role: library
    files:
      - src/mpi/module_mpi_TW_NEC.f90

  mpi_stub:
    cmake_role: library
    files:
      - src/mpi/module_mpi_stub.f90

  openmp_runtime:
    cmake_role: library
    files:
      - src/parallel/mod_openmp_runtime_enabled.f90

  serial_runtime:
    cmake_role: library
    files:
      - src/parallel/mod_openmp_runtime_stub.f90

  initial_conditions:
    cmake_role: library
    files:
      - src/init/mod_init_taylor_green.f90
      - src/init/mod_init_imported_turbulence.f90
      - src/init/mod_init_shock_turbulence.f90
      - src/init/mod_init_shock_tube_turbulence.f90
      - src/init/mod_hit_isotropy_math.f90
      - src/init/mod_nse_initial_conditions.f90

  initial_hit_stub:
    cmake_role: library
    files:
      - src/init/mod_init_hit_spectral_stub.f90

  initial_hit_2decomp_fftw:
    cmake_role: library
    files:
      - src/init/mod_init_hit_spectral_2decomp.f90

  initial_hit_cufft:
    cmake_role: library
    files:
      - src/init/mod_init_hit_spectral_cufft.f90

  initial_hit_cufftmp:
    cmake_role: library
    files:
      - src/gpu/mod_nse_cufftmp_fft.f90
      - src/init/mod_init_hit_spectral_2decomp.f90

  boundary_periodic:
    cmake_role: library
    files:
      - src/boundary/mod_boundary_periodic.f90

  boundary_runtime:
    cmake_role: library
    files:
      - src/boundary/mod_boundary_runtime.f90

  convective_runtime:
    cmake_role: library
    files:
      - src/numerics/reconstruction/mod_reconstruction_weno5z.f90
      - src/numerics/riemann/mod_riemann_roe.f90
      - src/numerics/convective/mod_convective_keep.f90
      - src/numerics/convective/mod_convective_weno5z_roe.f90
      - src/numerics/convective/mod_convective_leaf_registry.f90
      - src/numerics/convective/mod_convective_hybrid.f90
      - src/numerics/convective/mod_convective_dispatch.f90

  viscous_none:
    cmake_role: library
    files:
      - src/numerics/viscous/mod_viscous_none.f90

  viscous_central6:
    cmake_role: library
    files:
      - src/numerics/viscous/mod_viscous_central6.f90

  forcing_none:
    cmake_role: library
    files:
      - src/forcing/mod_nse_forcing_stub.f90

  forcing_2decomp_fftw:
    cmake_role: library
    files:
      - src/forcing/mod_nse_forcing_2decomp.f90

  forcing_cufftmp_contract:
    files:
      - src/forcing/cufftmp_forcing_contract.yaml
      - tests/test_cufftmp_forcing_contract.py
      - tests/validate_cufftmp_forcing_contract.cmake

  spatial_operator:
    cmake_role: library
    files:
      - src/numerics/mod_nse_spatial_operator.f90

  time_ssprk3:
    cmake_role: library
    files:
      - src/time/mod_nse_time_integration.f90

  runtime_tools:
    files:
      - tools/slf_to_paraview_merged_cropghost.py
      - tools/nse_turbulence_statistics.py
      - tools/nse_prepare_imported_turbulence.py
      - docs/NSE_SOLVER_SPECIFICATION.md
      - docs/NSE_BUILD_AND_RUN.md
      - docs/NSE_CUDA.md
      - docs/NSE_CUFFTMP.md
      - docs/NSE_FORCING.md
      - docs/NSE_FLUCTUATING_HYDRODYNAMICS.md
      - docs/NSE_HIT_DISTRIBUTED_FFT.md
      - docs/NSE_MODULE_DESIGN.md
      - docs/NSE_WENO5Z_ROE.md
      - docs/NSE_HYBRID_FLUX.md
      - docs/NSE_TURBULENCE_STATISTICS.md
      - docs/NSE_IMPORTED_TURBULENCE.md
      - docs/NSE_SHOCK_TURBULENCE_INTERACTION.md
      - docs/NSE_SHOCK_TUBE_TURBULENCE_INTERACTION.md

  cuda_backend:
    cmake_role: library
    files:
      - src/gpu/mod_nse_gpu_cuda.f90
      - src/gpu/nse_cuda_bridge.cu
      - src/gpu/nse_cuda_fluctuating.cuh
      - src/gpu/nse_cuda_weno5z_roe.cuh
      - src/gpu/nse_cuda_hybrid.cuh

  cuda_mpi_halo:
    cmake_role: library
    files:
      - src/gpu/mod_nse_gpu_mpi.f90

  main_cpu:
    cmake_role: executable
    files:
      - src/main/main_nse.f90

  main_cuda:
    cmake_role: executable
    files:
      - src/main/main_nse_cuda.f90

  main_cuda_mpi:
    cmake_role: executable
    files:
      - src/main/main_nse_mpi_cuda.f90

  tests_cuda:
    files:
      - tests/test_hit_parameter_resolution.f90
      - tests/test_cuda_positivity.f90
      - tests/input_positivity_retry.dat
      - tests/test_fluctuating.f90
      - tests/input_fluctuating.dat
      - tests/test_imported_turbulence.f90
      - tests/test_cuda_keep.f90
      - tests/test_cuda_boundary_non_reflecting.f90
      - tests/test_cuda_boundary_reflective.f90
      - tests/test_cuda_boundary_dirichlet.f90
      - tests/test_cuda_keep_compare.f90
      - tests/test_cuda_viscous_compare.f90
      - tests/input_tgv_cuda_small.dat
      - tests/input_tgv_cuda_weno5z_roe_small.dat
      - tests/input_tgv_hybrid_small.dat
      - tests/input_tgv_non_reflecting_small.dat
      - tests/input_tgv_non_reflecting_all_faces_small.dat
      - tests/input_tgv_reflective_small.dat
      - tests/input_tgv_dirichlet_small.dat
      - tests/input_tgv_cuda_forcing_small.dat
      - tests/input_hit_cuda_small.dat
      - tests/input_hit_targets_small.dat
      - tests/test_forcing_coefficients.f90
      - src/numerics/reconstruction/mod_reconstruction_weno5z.f90
      - src/numerics/riemann/mod_riemann_roe.f90
      - src/numerics/convective/mod_convective_keep.f90
      - src/numerics/convective/mod_convective_weno5z_roe.f90
      - src/numerics/convective/mod_convective_leaf_registry.f90
      - src/numerics/convective/mod_convective_hybrid.f90
      - src/numerics/convective/mod_convective_dispatch.f90
      - src/numerics/viscous/mod_viscous_central6.f90

  tests_cuda_mpi:
    files:
      - tests/check_cuda_mpi_transport_reject.cmake
      - tests/test_cuda_fluctuating_mpi.f90
      - tests/test_fluctuating.f90
      - tests/input_fluctuating.dat
      - tests/test_hit_parameter_resolution.f90
      - tests/test_imported_turbulence.f90
      - tests/test_forcing_coefficients.f90
      - tests/input_positivity_retry.dat
      - tests/input_tgv_cuda_small.dat
      - tests/input_tgv_non_reflecting_small.dat
      - tests/input_tgv_non_reflecting_all_faces_small.dat
      - tests/input_tgv_reflective_small.dat
      - tests/input_tgv_dirichlet_small.dat

  tests_cpu:
    files:
      - tests/test_hit_parameter_resolution.f90
      - tests/test_nse_positivity.f90
      - tests/input_positivity_retry.dat
      - tests/test_fluctuating.f90
      - tests/input_fluctuating.dat
      - tests/test_imported_turbulence.f90
      - tests/test_prepare_imported_turbulence.py
      - tests/test_keep6_accuracy.f90
      - tests/test_weno5z_roe.f90
      - tests/test_hybrid_flux.f90
      - tests/input_tgv_hybrid_small.dat
      - tests/input_tgv_weno5z_roe_small.dat
      - tests/test_viscous_central6.f90
      - tests/test_boundary_periodic.f90
      - tests/test_boundary_non_reflecting.f90
      - tests/test_boundary_reflective.f90
      - tests/test_boundary_dirichlet.f90
      - tests/input_tgv_non_reflecting_small.dat
      - tests/input_tgv_reflective_small.dat
      - tests/input_tgv_dirichlet_small.dat
      - tests/input_tgv_viscous_small.dat
      - tests/input_tgv_forcing_small.dat
      - tests/input_hit_forcing_small.dat
      - tests/test_hit_isotropy_math.f90
      - tests/test_forcing_coefficients.f90
      - tests/test_nse_turbulence_statistics.py

profiles:
  cpu_mpi:
    description: MPI domain decomposition with OpenMP local loops
    capabilities:
      - nse_basic
    components:
      - core
      - mpi_real
      - openmp_runtime
      - initial_conditions
      - initial_hit_stub
      - boundary_runtime
      - convective_runtime
      - viscous_central6
      - forcing_none
      - spatial_operator
      - time_ssprk3
      - runtime_tools
      - main_cpu
    test_components:
      - tests_cpu
    executable: solver
    execution:
      use_mpi: true
      use_openmp: true
    cmake:
      NSE_USE_MPI: true
      NSE_ENABLE_OPENMP: true
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: central6
      NSE_BOUNDARY_SCHEME: runtime
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none

  cpu_mpi_2decomp_fftw:
    description: MPI/OpenMP solver with 2DECOMP&FFT spectral HIT initialization
    capabilities:
      - nse_basic
      - hit_spectral
      - forcing_fft
    components:
      - core
      - mpi_real
      - openmp_runtime
      - initial_conditions
      - initial_hit_2decomp_fftw
      - boundary_runtime
      - convective_runtime
      - viscous_central6
      - forcing_2decomp_fftw
      - spatial_operator
      - time_ssprk3
      - runtime_tools
      - main_cpu
    test_components:
      - tests_cpu
    executable: solver
    execution:
      use_mpi: true
      use_openmp: true
    cmake:
      NSE_USE_MPI: true
      NSE_ENABLE_OPENMP: true
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: central6
      NSE_BOUNDARY_SCHEME: runtime
      NSE_INIT_FFT_BACKEND: 2decomp_fftw
      NSE_FORCING_FFT_BACKEND: 2decomp_fftw

  cuda_single:
    description: Single-GPU CUDA convective schemes and SSPRK3 backend
    capabilities:
      - nse_basic
      - hit_spectral
      - forcing_fft
    components:
      - core
      - mpi_stub
      - serial_runtime
      - initial_conditions
      - initial_hit_cufft
      - boundary_runtime
      - cuda_backend
      - forcing_cufftmp_contract
      - runtime_tools
      - main_cuda
    test_components:
      - tests_cuda
    executable: nse_cuda
    execution:
      use_mpi: false
      use_openmp: false
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: cuda
      NSE_CONVECTIVE_BACKEND: keep_family
      NSE_VISCOUS_SCHEME: central6
      NSE_BOUNDARY_SCHEME: runtime
      NSE_INIT_FFT_BACKEND: cufft
      NSE_FORCING_FFT_BACKEND: cufft

  cuda_mpi:
    description: One MPI rank per GPU with staged or optional CUDA-aware MPI halo exchange
    capabilities:
      - nse_basic
      - multi_gpu
    components:
      - core
      - mpi_real
      - serial_runtime
      - initial_conditions
      - initial_hit_stub
      - boundary_runtime
      - cuda_backend
      - cuda_mpi_halo
      - runtime_tools
      - main_cuda_mpi
    test_components:
      - tests_cuda_mpi
    executable: nse_mpi_cuda
    execution:
      use_mpi: true
      use_openmp: false
    cmake:
      NSE_USE_MPI: true
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: cuda
      NSE_CONVECTIVE_BACKEND: keep_family
      NSE_VISCOUS_SCHEME: central6
      NSE_BOUNDARY_SCHEME: runtime
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none

  cuda_mpi_cufftmp:
    description: One MPI rank per GPU with cuFFTMp HIT and Petersen-Livescu forcing
    fortran_preprocessor_defines:
      - NSE_INIT_CUFFTMP
    capabilities:
      - nse_basic
      - multi_gpu
      - hit_spectral
      - forcing_fft
    components:
      - core
      - mpi_real
      - serial_runtime
      - initial_conditions
      - initial_hit_cufftmp
      - boundary_runtime
      - cuda_backend
      - cuda_mpi_halo
      - forcing_cufftmp_contract
      - runtime_tools
      - main_cuda_mpi
    test_components:
      - tests_cuda_mpi
    executable: nse_mpi_cuda
    execution:
      use_mpi: true
      use_openmp: false
    cmake:
      NSE_USE_MPI: true
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: cuda
      NSE_CONVECTIVE_BACKEND: keep_family
      NSE_VISCOUS_SCHEME: central6
      NSE_BOUNDARY_SCHEME: runtime
      NSE_INIT_FFT_BACKEND: cufftmp
      NSE_FORCING_FFT_BACKEND: cufftmp
