schema_version: 1
backend: cufftmp
status: implemented
purpose: distributed Helmholtz decomposition for MPI plus CUDA forcing

requirements:
  host_gather_allowed: false
  state_location: distributed_device_resident
  precision: float64
  communicator: mpi
  fft_library: cufftmp
  transform: complex_to_complex_3d
  batches:
    forward: 3
    inverse: 3

operations:
  - initialize
  - upload_or_alias_local_weighted_velocity
  - forward_distributed_fft
  - project_local_spectral_pencil
  - allreduce_forcing_denominators
  - inverse_distributed_fft
  - add_local_momentum_rhs
  - finalize

configuration:
  scheme: petersen_livescu
  spectra:
    - full_spectrum
    - low_wavenumber
  fft_backend: cufftmp

activation_gate:
  runtime_available: true
  local_validation_available: false
  reason: the Windows development host has no Linux cuFFTMp/NVSHMEM runtime
  runtime_requirements:
    - Linux NVIDIA HPC SDK or compatible CUDA C++ toolchain
    - cuFFTMp and matching NVSHMEM from one HPC SDK release
    - MPI implementation compatible with the NVSHMEM bootstrap
    - one visible GPU per MPI rank
