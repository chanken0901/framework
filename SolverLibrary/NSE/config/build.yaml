# NSEの標準ビルド設計書。通常のビルド変更はこのファイルとmachine_profileで行う。
schema_version: 1
design_id: nse_windows_release
machine_profile: build_profiles/windows_msmpi.yaml
module_catalog: module_catalog.yaml

solver:
  module_set: default
  executable_name: solver
  include_modules: []
  exclude_modules: []

build:
  configuration: Release
  output_root: ${LOCALAPPDATA}/SolverLibraryBuild/NSE
  directory_name: windows-msmpi-release
  warnings: true
  parallel_jobs: 8
  configure_fresh: true

run:
  enabled: false
  input_file:
  mpi_processes: 4
  omp_threads: 8
  program_arguments: []
