# Additive multicomponent foundation through stage-8 MPI/OpenMP pencils.
# The production single-component NSE remains in solver_manifest.yaml.
schema_version: 1
solver_id: nse_multicomponent
solver_api_version: 1
model: nse_multicomponent
runtime_profile_selection: false
default_profiles:
  serial: cpu_serial_viscous
build_adapter: nse_cmake_v1
cmake_file: CMakeLists.txt

input:
  default_name: input.dat
  pass_as_argument: true

distribution:
  required_files:
    - CMakeLists.txt
    - cmake/NSEMPI.cmake

components:
  mpi_pencil_core:
    cmake_role: library
    files:
      - src/extensions/multicomponent/mod_mc_mpi_pencil.f90

  mpi_pencil_tests:
    files:
      - tests/test_multicomponent_mpi_pencil.f90

  main_mpi_pencil:
    cmake_role: executable
    files:
      - src/extensions/multicomponent/main_nse_multicomponent_mpi.f90

  foundation_core:
    cmake_role: library
    files:
      - src/common/mod_precision.f90
      - src/extensions/multicomponent/mod_mc_state_layout.f90
      - src/extensions/multicomponent/mod_mc_config.f90
      - src/extensions/multicomponent/mod_mc_provider_registry.f90

  thermodynamics_calorically_perfect:
    cmake_role: library
    files:
      - src/extensions/multicomponent/providers/mod_mc_thermodynamics_calorically_perfect.f90

  thermodynamics_thermally_perfect:
    cmake_role: library
    files:
      - src/extensions/multicomponent/providers/mod_mc_thermodynamics_thermally_perfect.f90

  transport_none:
    cmake_role: library
    files:
      - src/extensions/multicomponent/providers/mod_mc_transport_none.f90

  transport_mixture_averaged:
    cmake_role: library
    files:
      - src/extensions/multicomponent/providers/mod_mc_transport_mixture_averaged.f90

  chemistry_none:
    cmake_role: library
    files:
      - src/extensions/multicomponent/providers/mod_mc_chemistry_none.f90

  chemistry_one_step_arrhenius:
    cmake_role: library
    files:
      - src/extensions/multicomponent/providers/mod_mc_chemistry_one_step_arrhenius.f90

  chemistry_integrator_core:
    cmake_role: library
    files:
      - src/extensions/multicomponent/mod_mc_chemistry_integrator.f90

  main_foundation:
    cmake_role: executable
    files:
      - src/extensions/multicomponent/main_nse_multicomponent.f90

  passive_scalar_core:
    cmake_role: library
    files:
      - src/extensions/multicomponent/mod_mc_passive_scalar_config.f90
      - src/extensions/multicomponent/mod_mc_passive_scalar_field.f90
      - src/extensions/multicomponent/mod_mc_passive_scalar_advection.f90
      - src/extensions/multicomponent/mod_mc_passive_scalar_solver.f90

  main_passive_scalar:
    cmake_role: executable
    files:
      - src/extensions/multicomponent/main_nse_multicomponent_passive_scalar.f90

  euler_core:
    cmake_role: library
    files:
      - src/extensions/multicomponent/mod_mc_euler_config.f90
      - src/extensions/multicomponent/mod_mc_euler_field.f90
      - src/extensions/multicomponent/mod_mc_boundary.f90
      - src/extensions/multicomponent/mod_mc_euler_flux.f90
      - src/extensions/multicomponent/mod_mc_euler_solver.f90

  main_inviscid:
    cmake_role: executable
    files:
      - src/extensions/multicomponent/main_nse_multicomponent_inviscid.f90

  viscous_core:
    cmake_role: library
    files:
      - src/extensions/multicomponent/mod_mc_viscous_flux.f90
      - src/extensions/multicomponent/mod_mc_viscous_solver.f90

  main_viscous:
    cmake_role: executable
    files:
      - src/extensions/multicomponent/main_nse_multicomponent_viscous.f90

  reactor_core:
    cmake_role: library
    files:
      - src/extensions/multicomponent/mod_mc_reactor_config.f90
      - src/extensions/multicomponent/mod_mc_reactor_solver.f90

  main_reactor:
    cmake_role: executable
    files:
      - src/extensions/multicomponent/main_nse_multicomponent_reactor.f90

  reactive_core:
    cmake_role: library
    files:
      - src/extensions/multicomponent/mod_mc_reactive_config.f90
      - src/extensions/multicomponent/mod_mc_reactive_solver.f90

  main_reactive:
    cmake_role: executable
    files:
      - src/extensions/multicomponent/main_nse_multicomponent_reactive.f90

  foundation_tests:
    files:
      - tests/test_multicomponent_foundation.f90
      - tests/input_multicomponent_foundation.dat

  passive_scalar_tests:
    files:
      - tests/test_multicomponent_passive_scalar.f90
      - tests/input_multicomponent_passive_scalar.dat

  euler_tests:
    files:
      - tests/test_multicomponent_euler.f90
      - tests/input_multicomponent_euler.dat

  thermally_perfect_tests:
    files:
      - tests/test_multicomponent_thermally_perfect.f90
      - tests/input_multicomponent_thermally_perfect.dat

  viscous_tests:
    files:
      - tests/test_multicomponent_viscous.f90
      - tests/input_multicomponent_viscous.dat

  reactor_tests:
    files:
      - tests/test_multicomponent_reactor.f90
      - tests/input_multicomponent_reactor.dat

  reactive_tests:
    files:
      - tests/test_multicomponent_reactive.f90
      - tests/input_multicomponent_reactive.dat

  reactive_boundary_tests:
    files:
      - tests/test_multicomponent_reactive_boundaries.f90
      - tests/test_multicomponent_rhs_workspace.f90
      - tests/input_multicomponent_reactive_boundaries.dat

  foundation_docs:
    files:
      - docs/NSE_MULTICOMPONENT_ROADMAP.md
      - docs/NSE_MULTICOMPONENT_PARALLEL.md
      - docs/NSE_MULTICOMPONENT_REACTIVE_BOUNDARIES.md

profiles:
  cpu_serial_foundation:
    description: Stage-0 multicomponent state-layout and provider contract
    capabilities:
      - multicomponent_foundation
    components:
      - foundation_core
      - thermodynamics_calorically_perfect
      - transport_none
      - chemistry_none
      - foundation_docs
      - main_foundation
    test_components:
      - foundation_tests
    executable: nse_multicomponent
    execution:
      use_mpi: false
      use_openmp: false
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: periodic
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_foundation

  cpu_serial_passive_scalar:
    description: Stage-1 conservative periodic passive-scalar advection
    capabilities:
      - multicomponent_foundation
      - passive_scalar_advection
      - periodic_boundary
      - upwind1
      - ssprk3
    components:
      - foundation_core
      - thermodynamics_calorically_perfect
      - transport_none
      - chemistry_none
      - passive_scalar_core
      - foundation_docs
      - main_passive_scalar
    test_components:
      - foundation_tests
      - passive_scalar_tests
    executable: nse_multicomponent
    execution:
      use_mpi: false
      use_openmp: false
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: periodic
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_passive_scalar

  cpu_serial_inviscid:
    description: Stage-2 non-reacting inviscid multicomponent Euler solver
    capabilities:
      - multicomponent_foundation
      - nonreacting_multicomponent_euler
      - calorically_perfect_mixture
      - periodic_boundary
      - rusanov1
      - ssprk3
    components:
      - foundation_core
      - thermodynamics_calorically_perfect
      - transport_none
      - chemistry_none
      - euler_core
      - foundation_docs
      - main_inviscid
    test_components:
      - foundation_tests
      - euler_tests
    executable: nse_multicomponent
    execution:
      use_mpi: false
      use_openmp: false
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: periodic
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_euler

  cpu_serial_thermally_perfect:
    description: Stage-3 thermally-perfect non-reacting multicomponent Euler solver
    capabilities:
      - multicomponent_foundation
      - nonreacting_multicomponent_euler
      - thermally_perfect_ideal_gas_mixture
      - nasa7_thermodynamics
      - temperature_recovery
      - periodic_boundary
      - rusanov1
      - ssprk3
    components:
      - foundation_core
      - thermodynamics_thermally_perfect
      - transport_none
      - chemistry_none
      - euler_core
      - foundation_docs
      - main_inviscid
    test_components:
      - foundation_tests
      - thermally_perfect_tests
    executable: nse_multicomponent
    execution:
      use_mpi: false
      use_openmp: false
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: periodic
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_thermally_perfect

  cpu_serial_viscous:
    description: Stage-4 thermally-perfect mixture-averaged Navier-Stokes solver
    capabilities:
      - multicomponent_foundation
      - nonreacting_multicomponent_navier_stokes
      - thermally_perfect_ideal_gas_mixture
      - nasa7_thermodynamics
      - temperature_recovery
      - mixture_averaged_species_diffusion
      - newtonian_viscosity
      - fourier_heat_conduction
      - periodic_boundary
      - rusanov1
      - ssprk3
    components:
      - foundation_core
      - thermodynamics_thermally_perfect
      - transport_mixture_averaged
      - chemistry_none
      - euler_core
      - viscous_core
      - foundation_docs
      - main_viscous
    test_components:
      - foundation_tests
      - viscous_tests
    executable: nse_multicomponent
    execution:
      use_mpi: false
      use_openmp: false
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: periodic
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_viscous

  cpu_serial_reactor:
    description: Stage-5 adiabatic constant-volume homogeneous finite-rate chemistry
    capabilities:
      - multicomponent_foundation
      - homogeneous_constant_volume_reactor
      - thermally_perfect_ideal_gas_mixture
      - nasa7_thermodynamics
      - one_step_irreversible_arrhenius
      - conservative_mass_and_energy
      - ssprk3
    components:
      - foundation_core
      - thermodynamics_thermally_perfect
      - transport_none
      - chemistry_one_step_arrhenius
      - chemistry_integrator_core
      - reactor_core
      - foundation_docs
      - main_reactor
    test_components:
      - foundation_tests
      - reactor_tests
    executable: nse_multicomponent
    execution:
      use_mpi: false
      use_openmp: false
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: periodic
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_reactor

  cpu_serial_reactive:
    description: Stage-6 Strang-split reactive multicomponent Navier-Stokes solver
    capabilities:
      - multicomponent_foundation
      - reactive_multicomponent_navier_stokes
      - thermally_perfect_ideal_gas_mixture
      - nasa7_thermodynamics
      - mixture_averaged_species_diffusion
      - newtonian_viscosity
      - fourier_heat_conduction
      - one_step_irreversible_arrhenius
      - strang_splitting
      - chemistry_subcycling
      - conservative_mass_momentum_and_energy
      - periodic_boundary
      - rusanov1
      - ssprk3
    components:
      - foundation_core
      - thermodynamics_thermally_perfect
      - transport_mixture_averaged
      - chemistry_one_step_arrhenius
      - chemistry_integrator_core
      - euler_core
      - viscous_core
      - reactive_core
      - foundation_docs
      - main_reactive
    test_components:
      - foundation_tests
      - reactive_tests
    executable: nse_multicomponent
    execution:
      use_mpi: false
      use_openmp: false
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: periodic
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_reactive

  cpu_serial_reactive_boundaries:
    description: Stage-7 reactive shock tube, physical boundaries, and history output
    capabilities:
      - multicomponent_foundation
      - reactive_multicomponent_navier_stokes
      - thermally_perfect_ideal_gas_mixture
      - nasa7_thermodynamics
      - mixture_averaged_species_diffusion
      - newtonian_viscosity
      - fourier_heat_conduction
      - one_step_irreversible_arrhenius
      - strang_splitting
      - chemistry_subcycling
      - reactive_shock_tube
      - face_specific_boundaries
      - characteristic_non_reflecting_boundary
      - reflective_boundary
      - dirichlet_boundary
      - transient_snapshots
      - integral_history
      - rusanov1
      - ssprk3
    components:
      - foundation_core
      - thermodynamics_thermally_perfect
      - transport_mixture_averaged
      - chemistry_one_step_arrhenius
      - chemistry_integrator_core
      - euler_core
      - viscous_core
      - reactive_core
      - foundation_docs
      - main_reactive
    test_components:
      - foundation_tests
      - reactive_tests
      - reactive_boundary_tests
    executable: nse_multicomponent
    execution:
      use_mpi: false
      use_openmp: false
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: false
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: runtime
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_reactive_boundaries



  cpu_openmp_reactive:
    description: Stage-8 OpenMP reactive flow
    capabilities:
      - multicomponent_foundation
      - reactive_multicomponent_navier_stokes
      - thermally_perfect_ideal_gas_mixture
      - nasa7_thermodynamics
      - mixture_averaged_species_diffusion
      - newtonian_viscosity
      - fourier_heat_conduction
      - one_step_irreversible_arrhenius
      - strang_splitting
      - chemistry_subcycling
      - reactive_shock_tube
      - face_specific_boundaries
      - characteristic_non_reflecting_boundary
      - reflective_boundary
      - dirichlet_boundary
      - transient_snapshots
      - integral_history
      - rusanov1
      - ssprk3
    components:
      - foundation_core
      - thermodynamics_thermally_perfect
      - transport_mixture_averaged
      - chemistry_one_step_arrhenius
      - chemistry_integrator_core
      - euler_core
      - viscous_core
      - reactive_core
      - foundation_docs
      - main_reactive
    test_components:
      - foundation_tests
      - reactive_tests
      - reactive_boundary_tests
    executable: nse_multicomponent
    execution:
      use_mpi: false
      use_openmp: true
    cmake:
      NSE_USE_MPI: false
      NSE_ENABLE_OPENMP: true
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: runtime
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_reactive_boundaries

  cpu_mpi_reactive_pencil:
    description: Stage-8 MPI x-pencils (y-z Cartesian partition), optional OpenMP
    capabilities:
      - multicomponent_foundation
      - reactive_multicomponent_navier_stokes
      - thermally_perfect_ideal_gas_mixture
      - nasa7_thermodynamics
      - mixture_averaged_species_diffusion
      - newtonian_viscosity
      - fourier_heat_conduction
      - one_step_irreversible_arrhenius
      - strang_splitting
      - chemistry_subcycling
      - reactive_shock_tube
      - face_specific_boundaries
      - characteristic_non_reflecting_boundary
      - reflective_boundary
      - dirichlet_boundary
      - transient_snapshots
      - integral_history
      - rusanov1
      - ssprk3
    components:
      - foundation_core
      - thermodynamics_thermally_perfect
      - transport_mixture_averaged
      - chemistry_one_step_arrhenius
      - chemistry_integrator_core
      - euler_core
      - viscous_core
      - reactive_core
      - foundation_docs
      - mpi_pencil_core
      - main_mpi_pencil
    test_components:
      - foundation_tests
      - reactive_tests
      - reactive_boundary_tests
      - mpi_pencil_tests
    executable: nse_multicomponent
    execution:
      use_mpi: true
      use_openmp: true
    cmake:
      NSE_USE_MPI: true
      NSE_ENABLE_OPENMP: true
      NSE_GPU_BACKEND: none
      NSE_CONVECTIVE_BACKEND: runtime
      NSE_VISCOUS_SCHEME: none
      NSE_BOUNDARY_SCHEME: runtime
      NSE_INIT_FFT_BACKEND: none
      NSE_FORCING_FFT_BACKEND: none
      NSE_TEST_SUITE: multicomponent_reactive_boundaries
