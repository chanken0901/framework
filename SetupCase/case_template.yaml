case_id: {{case_id}}
case_label: {{case_label}}
status: planned
description: {{description}}
created_at: {{created_at}}

project:
  name: {{project_name}}
  author: Kento Tanaka

physics:
  model: compressible_euler
  nse:
    nv: 5
    nghost: 3
    gamma: 1.4
    small_rho: 1.0e-12
    small_p: 1.0e-12
    rho0: 1.0
    mach_number: 0.5
    reynolds_number: 0.0
    prandtl_number: 0.72

flow:
  type: tgv
  tgv:
    amplitude: 1.0
    mode_x: 1
    mode_y: 1
    mode_z: 1

grid:
  nx: 64
  ny: 64
  nz: 64
  x_min: 0.0
  x_max: 6.283185307179586
  y_min: 0.0
  y_max: 6.283185307179586
  z_min: 0.0
  z_max: 6.283185307179586

time:
  cfl: 0.5
  dt: 1.0e-4
  t_max: 100.0
  nsteps: 1000
  output_frequency: 10

solver:
  type: nse
  backend: serial
  use_mpi: true
  use_openmp: true

numerics:
  reconstruction:
  time_integration: RK3
  flux: KEEP

storage:
  raw_data_location: {{raw_data_location}}
  output_dir: output
  output_format: slf
  restart_location:

outputs:
  used_in: